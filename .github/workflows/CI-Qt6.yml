name: Qt6 CI

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    tags:
      - '**'
    paths-ignore:
      - .gitignore
      - README.md

  pull_request:
    branches:
      - qt6
    paths-ignore:
      - .gitignore
      - README.md

concurrency:
  # cancel jobs on PRs only
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  QT_VERSION: 6.7.1

jobs:
  build:
    name: Build qcocoa
    runs-on: macos-14
    strategy:
      matrix:
        type: [shared, static]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: source
          fetch-depth: 0

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Download Qt
        if: matrix.type == 'shared'
        uses: jurplel/install-qt-action@v4
        with:
          aqtversion: ==3.1.*
          version: ${{ env.QT_VERSION }}
          target: desktop

      - name: Download Static Qt
        if: matrix.type == 'static'
        run: |
          cd ..
          wget https://github.com/ntadej/qt-build/releases/download/v${QT_VERSION}.0/Qt_macOS_static.tar.bz2
          tar xvf Qt_macOS_static.tar.bz2
          echo "QT_ROOT_DIR=$PWD/Qt/$QT_VERSION/macos_static" >> $GITHUB_ENV
          echo "$PWD/Qt/$QT_VERSION/macos_static/bin" >> $GITHUB_PATH
          cd $GITHUB_WORKSPACE

      - name: Prepare Qt
        run: |
          rm $QT_ROOT_DIR/lib/cmake/Qt6Gui/Qt6QCocoaIntegrationPlugin*

      - name: Setup ninja
        uses: seanmiddleditch/gha-setup-ninja@v4

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ${{ matrix.type }}
          max-size: 200M

      - name: Build qcocoa
        run: |
          mkdir build && cd build
          qt-cmake ../source/ \
            -G Ninja \
            -DCMAKE_BUILD_TYPE="RelWithDebInfo" \
            -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          ninja
          DESTDIR=../install ninja install

      - name: Create artifacts
        run: |
          pushd install/Users/runner/work/qcocoa
          tar cjvf ../../../../../qcocoa.tar.bz2 Qt
          popd

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qcocoa_${{ matrix.type }}
          path: qcocoa.tar.bz2

  release:
    name: Release qcocoa
    if: github.ref_type == 'tag'
    runs-on: macos-14
    strategy:
      matrix:
        type: [shared, static]
    needs: build
    permissions:
      contents: write

    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: qcocoa_${{ matrix.type }}

    - name: Make tarball
      env:
        TAG_NAME: ${{ github.ref_name }}
        BUILD_TYPE: ${{ matrix.type }}
      run: |
        if [[ $BUILD_TYPE == 'static' ]]; then
          mv qcocoa.tar.bz2 qcocoa_static_${TAG_NAME}.tar.bz2
        else
          mv qcocoa.tar.bz2 qcocoa_${TAG_NAME}.tar.bz2
        fi

    - name: Release
      uses: ncipollo/release-action@v1
      with:
        artifacts: qcocoa_*${{ github.ref_name }}.tar.bz2
        allowUpdates: true
        draft: true
